version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint 8 only supports TypeScript below 6.1. Allow 7 once it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep the Node.js types on the major version in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
